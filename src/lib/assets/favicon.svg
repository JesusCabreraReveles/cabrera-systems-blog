<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Same frame and glow as the portfolio favicon; speech bubble + cursor in the blog accent. -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#050a14" />

  <g filter="url(#glow)">
    <!-- Speech bubble -->
    <path d="M 24 20 H 76 A 8 8 0 0 1 84 28 V 60 A 8 8 0 0 1 76 68 H 46 L 30 82 V 68 H 24 A 8 8 0 0 1 16 60 V 28 A 8 8 0 0 1 24 20 Z"
      fill="#050a14" stroke="#f97316" stroke-width="6" stroke-linejoin="round" />
    <!-- Prompt cursor -->
    <path d="M 33 34 L 43 44 L 33 54" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="50" y="49" width="18" height="6" rx="2" fill="#ffffff" />
  </g>
</svg>
